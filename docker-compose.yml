# ACR Chatbot — knowledge service (extractor + OKF knowledge bundle API)
#
# Full runbook: README.md -> "Deploy runbook". Server layout: repo cloned into /opt/acr-chatbot,
# data in /opt/acr-chatbot/data (git-ignored).
#   1. Put the bundle on the server:   rsync -a knowledge/ <server>:/opt/acr-chatbot/data/knowledge/
#   2. Create .env next to this file:  KB_TOKEN=<long random string>   (openssl rand -hex 32)
#                                      KB_UID=<id -u of the data owner>  KB_GID=<id -g>  (default 1000)
#                                      KB_HOST_DIR=<other data dir>      (optional, default ./data)
#   3. sudo podman rm -f acr-trafilatura   (v1 container, if it exists — stateless)
#      sudo podman compose up -d --build    (Docker: docker compose up -d --build)
#   4. curl -s localhost:8080/health ; curl -s -H "Authorization: Bearer $KB_TOKEN" \
#           "localhost:8080/kb/search?q=80G" | head
#
# n8n reaches it by container name on the shared network (no published port needed):
#   http://acr-trafilatura:8000/extract      (Workflow A, unchanged)
#   http://acr-trafilatura:8000/kb/...       (chat agent + sync jobs, Bearer KB_TOKEN)
# The host port is bound to 127.0.0.1 only: /kb has write routes, keep it off the internet.

services:
  trafilatura:
    build: ./trafilatura-service
    image: acr-trafilatura:latest
    container_name: acr-trafilatura
    restart: unless-stopped
    user: "${KB_UID:-1000}:${KB_GID:-1000}"     # = owner of KB_HOST_DIR on the host (id -u / id -g)
    networks:
      - n8n_net
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      KB_TOKEN: ${KB_TOKEN:?set KB_TOKEN in .env}
      KB_ALLOW_DRAFTS: ${KB_ALLOW_DRAFTS:-0}     # 1 = serve unapproved topic pages (testing only)
      KB_GIT: "1"
    volumes:
      - ${KB_HOST_DIR:-./data}:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# n8n runs on the network n8n-production created. Attach to that existing network
# (external) via its real name instead of making a new isolated one.
# Confirm the name with: sudo podman ps --format '{{.Names}} {{.Networks}}' | grep n8n
networks:
  n8n_net:
    external: true
    name: n8n-production_n8n-net

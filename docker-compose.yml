# ACR Chatbot — self-hosted services
# Trafilatura HTML->Markdown microservice (replaces Jina Reader in Workflow A).
#
#   podman compose up -d --build        # (Docker: docker compose up -d --build)
#   curl -s localhost:8080/health
#   curl -s -X POST localhost:8080/extract -H 'Content-Type: application/json' \
#        -d '{"url":"https://acr.iitbombay.org/"}' | head
#
# Call from n8n (n8n is on n8n-net, so use the container name, no published port needed):
#   http://acr-trafilatura:8000/extract
# n8n elsewhere / remote: http://<this-host-ip>:8080/extract (open the port / tunnel)

services:
  trafilatura:
    build: ./trafilatura-service
    image: acr-trafilatura:latest
    container_name: acr-trafilatura
    restart: unless-stopped
    networks:
      - n8n-net
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# n8n-net is created by n8n's own compose — declare it external so podman attaches
# to the existing network instead of making a new isolated one.
networks:
  n8n-net:
    external: true
